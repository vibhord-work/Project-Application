services:
  database:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: hospitalDBMS
      MYSQL_USER: hospital_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - hospital_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: hospital_app
      DB_PASSWORD: ${MYSQL_APP_PASSWORD}
      DB_NAME: hospitalDBMS
    depends_on:
      database:
        condition: service_healthy
    networks:
      - hospital_network
    healthcheck:
      test: ["CMD", "node", "-e","require('http').get('http://127.0.0.1:8081/doctors',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hospital_network

networks:
  hospital_network:
    driver: bridge
volumes:
  mysql_data:
    external: true
    name: hospital-mysql-data
