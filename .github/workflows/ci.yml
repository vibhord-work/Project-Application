
name: Hospital Application CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  # =========================================
  # 1. APPLICATION QUALITY + SONARCLOUD
  # =========================================
  application-ci:
    name: Application Quality and SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Backend lint
        working-directory: backend
        run: npm run lint

      - name: Frontend tests and coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Backend tests and coverage
        working-directory: backend
        run: npm run test:coverage

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: SonarCloud Analysis
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=frontend/src,backend
            -Dsonar.tests=frontend/src,backend
            -Dsonar.test.inclusions=**/*.test.js,**/*.test.jsx
            -Dsonar.exclusions=**/*.test.js,**/*.test.jsx,**/node_modules/**,**/coverage/**
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info
            -Dsonar.qualitygate.wait=true

  # =========================================
  # 2. TRIVY SECURITY SCANNING
  # =========================================
  security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filesystem vulnerability and secret scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs-results.sarif
          exit-code: '0'

      - name: Infrastructure and Docker configuration scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-config-results.sarif
          exit-code: '0'

      - name: Upload filesystem scan results
        if: always() && hashFiles('trivy-fs-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem

      - name: Upload configuration scan results
        if: always() && hashFiles('trivy-config-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-config-results.sarif
          category: trivy-configuration

  # =========================================
  # 3. DOCKER BUILD VALIDATION
  # =========================================
  docker-validation:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: application-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build frontend image
        run: |
          docker build \
            -t hospital-frontend:ci \
            ./frontend

      - name: Build backend image
        run: |
          docker build \
            -t hospital-backend:ci \
            ./backend
